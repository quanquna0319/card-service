name: build-image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: card-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CARD_BUILD_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: card-service:smoke
          build-args: |
            CARD_BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha

      - name: Refuse insecure defaults
        run: |
          set +e
          docker run --rm -e CARD_SECRET=LICENSE_BLOB -e CARD_ADMIN_PASSWORD=ADMIN_PASSWORD card-service:smoke
          code=$?
          set -e
          test "$code" -ne 0
          echo "OK: refused insecure defaults (exit $code)"

      - name: Run and probe health
        run: |
          docker run -d --name smoke \
            -p 127.0.0.1:8080:8080 \
            -e CARD_SECRET="$(openssl rand -hex 32)" \
            -e CARD_ADMIN_PASSWORD="SmokePass-2026" \
            -e CARD_ADMIN_USER=admin \
            card-service:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /dev/null
          curl -fsS http://127.0.0.1:8080/fonts/spline-sans-mono-var.woff2 > /dev/null
          curl -sS -X POST http://127.0.0.1:8080/api/verify_card.php \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "card_code=TEST-SERIAL" \
            --data-urlencode "app_id=APP_ID" \
            --data-urlencode "uuid=smoke-device" | tee /tmp/verify.json
          grep -q '"status": "error"' /tmp/verify.json

      - name: Container logs
        if: always()
        run: docker logs smoke || true
